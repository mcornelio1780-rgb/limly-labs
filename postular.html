<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limly Labs — Postulación / Application 2026</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0B1130;--surface:#161B3D;--paper:#F4F1EA;--coral:#FF6B4A;--muted:#6B6F8C;--line:rgba(244,241,234,.10);--grad:linear-gradient(100deg,#FF6B4A 0%,#FFB088 100%)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--night);color:var(--paper);font-family:Inter,system-ui,sans-serif;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
a{color:var(--coral)}
h1{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,17,48,.88);backdrop-filter:blur(14px);z-index:20}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.04em;font-size:16px;text-decoration:none;color:var(--paper)}
.iso{width:24px;height:24px;border-radius:50%;background:conic-gradient(from 190deg at 50% 50%,var(--coral) 0deg 90deg,var(--paper) 90deg 360deg)}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{background:none;border:0;color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;padding:4px 9px;border-radius:999px;cursor:pointer}
.langs button.on{background:var(--coral);color:#0B1130;font-weight:700}
.intro{padding:54px 0 34px}
.intro p{color:rgba(244,241,234,.70);margin-top:16px;max-width:620px}
form{padding-bottom:70px}
fieldset{border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:22px;background:var(--surface)}
legend{padding:0 10px;font-family:'Space Mono',monospace;font-size:11.5px;color:var(--coral)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f{margin-bottom:16px}
label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
label .opt{font-weight:400;color:var(--muted);font-size:12px}
input,select,textarea{width:100%;background:rgba(11,17,48,.6);border:1px solid var(--line);color:var(--paper);
  border-radius:10px;padding:11px 13px;font-family:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:transparent}
select option{background:#0B1130;color:var(--paper)}
input[type=file]{padding:9px;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.roles-box{border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:10px}
.rl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.rl:last-child{border-bottom:0}
.rl input{width:auto;margin-top:5px}
.rl span{font-size:14.5px}
.rl small{display:block;color:var(--muted);font-size:12.5px}
.consent{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:rgba(244,241,234,.72)}
.consent input{width:auto;margin-top:4px}
.submit{background:var(--grad);color:#0B1130;border:0;border-radius:999px;padding:14px 30px;font-weight:700;font-size:16px;cursor:pointer;width:100%;margin-top:8px}
.submit[disabled]{opacity:.55;cursor:not-allowed}
.msg{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:14.5px;display:none}
.msg.ok{display:block;background:rgba(255,107,74,.12);border:1px solid rgba(255,107,74,.4)}
.msg.err{display:block;background:rgba(255,80,80,.10);border:1px solid rgba(255,80,80,.4)}
.done{display:none;text-align:center;padding:70px 0}
.done h1{margin-bottom:16px}
.done p{color:rgba(244,241,234,.72);max-width:520px;margin:0 auto}
footer{border-top:1px solid var(--line);padding:26px 0;font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted)}
@media(max-width:640px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="index.html"><span class="iso"></span>LIMLY LABS</a>
    <div class="langs"><button data-lang="es">ES</button><button data-lang="en">EN</button><button data-lang="pt">PT</button></div>
  </div>
</header>

<div id="formview">
<div class="wrap intro">
  <h1 data-i18n="fm.h1"></h1>
  <p data-i18n="fm.intro"></p>
</div>

<div class="wrap">
<form id="applyform" novalidate>

  <fieldset>
    <legend data-i18n="fm.sec1"></legend>
    <div class="row">
      <div class="f"><label data-i18n="fm.first"></label><input name="nombres" required></div>
      <div class="f"><label data-i18n="fm.last"></label><input name="apellidos" required></div>
    </div>
    <div class="row">
      <div class="f"><label data-i18n="fm.email"></label><input type="email" name="email" required></div>
      <div class="f"><label data-i18n="fm.phone"></label><input name="telefono" placeholder="+51 999 999 999" required>
        <p class="hint" data-i18n="fm.phonehint"></p></div>
    </div>
    <div class="row">
      <div class="f"><label data-i18n="fm.country"></label><input name="pais" required></div>
      <div class="f"><label data-i18n="fm.city"></label><input name="ciudad" required></div>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="fm.sec2"></legend>
    <div class="row">
      <div class="f"><label data-i18n="fm.university"></label><input name="universidad" required></div>
      <div class="f"><label data-i18n="fm.career"></label><input name="carrera" required></div>
    </div>
    <div class="row">
      <div class="f"><label data-i18n="fm.cycle"></label>
        <select name="ciclo" id="ciclo" required></select>
        <p class="hint" data-i18n="fm.cyclehint"></p>
      </div>
      <div class="f"><label data-i18n="fm.hours"></label>
        <select name="horas" id="horas" required></select>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="fm.sec3"></legend>
    <div class="f">
      <label data-i18n="fm.squad"></label>
      <select name="squad" id="squad" required></select>
      <p class="hint" data-i18n="fm.squadhint"></p>
    </div>
    <div class="f" id="rolesfield">
      <label data-i18n="fm.role"></label>
      <div class="roles-box" id="rolesbox"></div>
    </div>
    <div class="f">
      <label data-i18n="fm.oncam"></label>
      <select name="camara" id="camara" required></select>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="fm.sec4"></legend>
    <div class="f">
      <label data-i18n="fm.cv"></label>
      <input type="file" name="cv" id="cv" accept=".pdf,.doc,.docx" required>
      <p class="hint" data-i18n="fm.cvhint"></p>
    </div>
    <div class="f">
      <label data-i18n="fm.portfolio"></label>
      <input type="file" name="portafolio" id="portafolio" accept=".pdf,.zip,.png,.jpg,.jpeg,.mp4">
      <p class="hint" data-i18n="fm.pfhint"></p>
    </div>
    <div class="f">
      <label data-i18n="fm.link"></label>
      <input name="enlace" type="url" placeholder="https://">
      <p class="hint" data-i18n="fm.linkhint"></p>
    </div>
    <div class="f">
      <label data-i18n="fm.why"></label>
      <textarea name="motivacion" rows="4" maxlength="600"></textarea>
      <p class="hint" data-i18n="fm.whyhint"></p>
    </div>
    <div class="f">
      <label data-i18n="fm.source"></label>
      <select name="fuente" id="fuente"></select>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="fm.sec5"></legend>
    <label class="consent"><input type="checkbox" name="consent" required><span data-i18n="fm.consent"></span></label>
  </fieldset>

  <button class="submit" type="submit" id="submitbtn" data-i18n="fm.send"></button>
  <div class="msg" id="msg"></div>
</form>
</div>
</div>

<div class="done wrap" id="doneview">
  <h1 data-i18n="fm.doneh"></h1>
  <p data-i18n="fm.donep"></p>
  <p style="margin-top:22px"><a href="index.html" data-i18n="fm.back"></a></p>
</div>

<footer><div class="wrap"><span data-i18n="fm.legal"></span></div></footer>

"about.p2":"It was founded by two people who got tired of waiting. One comes from the business and go-to-market side; the other from product and engineering. That mix is why an idea can become a shipped product in days, and why every unit is born with brand, website, channel and pricing already defined.",
"about.f1name":"Michell Anyosa","about.f1role":"Co-founder · CEO",
"about.f1bio":"Leads the holding's strategy, client and investor relationships, and the launch of every new unit. His job is making sure no idea stays inside a document.",
"about.f2name":"[Co-founder — add name]","about.f2role":"Co-founder · CTO",
"about.f2bio":"[Add bio from limly.io/about] Owns product and technical infrastructure across the portfolio: what lets nine units run on one engine without multiplying cost.",

"what.h2":"What we do",
"what.p":"A venture studio is not an incubator or a fund. We bring the idea, the code, the brand and the first customers. Every unit is born inside the holding and reaches the market with infrastructure already in place.",
"what.c1t":"We find the problem","what.c1d":"Market research, competitor mapping and validation of real pain before a single line of code.",
"what.c2t":"We build the product","what.c2d":"From idea to shipped product in days, not quarters. AI as execution infrastructure, not as a sales pitch.",
"what.c3t":"We get the first dollar","what.c3d":"Brand, site, content and acquisition channel from day one. No unit exists until someone pays for it.",
"what.c4t":"We scale or shut down","what.c4d":"What grows gets more resources. What doesn't work is switched off fast and without drama. Discipline is the asset.",

"pf.h2":"Nine units, one holding",
"pf.p":"Three units are in aggressive growth focus this quarter: Limly, Chass and Fluxo. The rest are operating, generating revenue or in validation.",
"pf.focus":"Growth focus","pf.building":"In build","pf.validating":"In validation","pf.revenue":"Generating revenue",
"pf.soon":"coming soon","pf.agency":"holding agency",
"pf.limly":"Your AI chief of staff. It captures meetings with no bot in the call and turns every conversation into searchable memory, assigned tasks and drafted follow-ups. Mac, Windows and 60+ languages.",
"pf.chass":"Cross-border payment infrastructure for LATAM. Charging and moving money between countries without the friction, delays and fees of traditional banking.",
"pf.fluxo":"AI support for SaaS in 10 lines of code. Open source, native to React and Next.js: the agent learns from your team's answers and replies inside your product.",
"pf.yarah":"A full C-level of AI agents: general management, marketing, finance, operations, legal, sales, growth and customer success. They think, research and execute nonstop.",
"pf.praxon":"Technology development studio. Custom software, dashboards, ERP and process automation. International standard at nearshore cost.",

"map.p":"Our users are spread across the Americas, Europe, Asia and Oceania. So is the team: anyone joining the programme works with colleagues across several time zones and in three languages from week one.",

"model.h2":"How we operate","model.p":"Six rules that apply equally to the unit generating revenue and to the one that doesn't exist yet.",
"model.p1t":"Revenue first","model.p1d":"We don't raise capital before validating real income. The first customer is the only round that matters early on.",

"model.p4t":"AI as a team, not a tool","model.p4d":"Agents with a role, a goal and a metric. Every person here operates as if running a whole department.",

"model.p6t":"Speed over perfection","model.p6d":"We prefer shipping today and fixing tomorrow. What never reaches the market learns nothing.",

"int.orgh":"How the team is organised",
"int.orgp":"We're not looking for generic marketing interns. Everyone joins a squad assigned to a specific business unit, with its own metric. Twelve of the twenty-two openings sit with Limly, Chass and Fluxo, because visibility for those three is the priority this quarter.",

"pr.p":"The call opens once per cohort and doesn't reopen until the next one. These are the six steps, from application to certificate.",
"pr.s1":"Step 1","pr.s1t":"Application","pr.s1d":"A five-minute form with your details, your CV and a link to your portfolio or repository. No cover letter.",
"pr.s2":"Step 2","pr.s2t":"Selection","pr.s2d":"We review every application. If you move forward, we email you a link to book your interview at a time that suits you.",

"bn.certp":"On completing the programme you receive a certificate issued by Limly Labs LLC, a company registered in Delaware, United States. It isn't a generic participation slip: it documents what you did, with what results, and it's verifiable by your university and by any employer inside or outside your country.",

"bn.cert2":"Renewable for a second period: up to 24 accumulated weeks on the same certificate",
"bn.cert3":"Details of the role, the business unit, the duties and the results achieved",
"bn.cert4":"Issued in Spanish and English, with an online verification code",
"bn.cert5":"Signed by a co-founder and by your direct squad lead",
"bn.cert6":"Compatible with university internship accreditation: we complete the forms and agreements your faculty requires",
"bn.culth":"A team from several countries in the same room",
"bn.cultp":"We currently have interns in the United States, Venezuela, Argentina and Peru. That isn't trivia: it changes how you work and what you learn.",
"bn.cult1":"You coordinate with colleagues across time zones and learn to work asynchronously",
"bn.cult2":"You live with Spanish, English and Portuguese in daily work, not in a course",
"bn.cult3":"You see how one message is adapted to markets with different cultures and slang",
"bn.cult4":"You build a professional network that doesn't stop at your city limits",
"bn.honest":"To be clear: there is no financial compensation during the programme. If you need income now, this call isn't for you and we'd rather say so before you invest time applying. If what you want is real experience, an international certificate and a way into a team that does pay once someone proves they contribute, here it is.",

var LANG='es';
function t(k){ return (FORM_I18N[LANG]&&FORM_I18N[LANG][k]) || (I18N[LANG]&&I18N[LANG][k]) || FORM_I18N.es[k] || k; }

function fill(id,opts,ph){
  var s=document.getElementById(id); if(!s) return;
  var cur=s.value;
  s.innerHTML='<option value="">'+ph+'</option>'+opts.map(function(o){
    return '<option value="'+o.v+'">'+o.l+'</option>';}).join('');
  if(cur) s.value=cur;
}
function renderRoles(){
  var box=document.getElementById('rolesbox');
  var sq=document.getElementById('squad').value;
  box.innerHTML='';
  if(!sq){ box.innerHTML='<p class="hint">'+t('fm.squadhint')+'</p>'; return; }
  if(sq==='any'){ box.innerHTML='<p class="hint">'+t('fm.anysquad')+'</p>'; return; }
  var s=SQUADS.filter(function(x){return x.id===sq;})[0]; if(!s) return;
  var html=s.roles.map(function(r,i){
    return '<label class="rl"><input type="checkbox" name="perfil" value="'+s.id+':'+r.title.es+'">'+
      '<span>'+r.title[LANG]+'<small>'+r.n+' · '+r.cycle[LANG]+(r.onCamera?' · '+I18N[LANG]['int.oncam']:'')+'</small></span></label>';
  }).join('');
  html+='<label class="rl"><input type="checkbox" name="perfil" value="'+s.id+':any"><span>'+t('fm.any')+'</span></label>';
  box.innerHTML=html;
}
function applyLang(l){
  LANG=l; document.documentElement.lang=l;
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on',b.dataset.lang===l); });
  try{localStorage.setItem('ll_lang',l);}catch(e){}
  var cy=[]; for(var i=1;i<=12;i++) cy.push({v:i,l:String(i)});
  fill('ciclo',cy,t('fm.select'));
  fill('horas',[{v:"<12",l:"< 12"},{v:"12-15",l:"12 – 15"},{v:"16-20",l:"16 – 20"},{v:">20",l:"> 20"}],t('fm.select'));
  fill('squad',SQUADS.map(function(s){return {v:s.id,l:s.name+' · '+s.total+' '+I18N[l]['int.vacn']};})
    .concat([{v:'any',l:t('fm.anysquad')}]),t('fm.selectsquad'));
  fill('camara',[{v:'si',l:t('fm.yes')},{v:'produzco',l:t('fm.maybe')},{v:'no',l:t('fm.no')}],t('fm.select'));
  fill('fuente',[{v:'linkedin',l:t('fm.src1')},{v:'social',l:t('fm.src2')},{v:'universidad',l:t('fm.src3')},{v:'referido',l:t('fm.src4')},{v:'otro',l:t('fm.src5')}],t('fm.select'));
  renderRoles();
}
document.querySelectorAll('.langs button').forEach(function(b){ b.addEventListener('click',function(){applyLang(b.dataset.lang);}); });
document.getElementById('squad').addEventListener('change',renderRoles);

function toBase64(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){res(String(r.result).split(',')[1]);};
    r.onerror=function(){rej(new Error('read'));};
    r.readAsDataURL(file);
  });
}
function show(kind,text){ var m=document.getElementById('msg'); m.className='msg '+kind; m.textContent=text; }

document.getElementById('applyform').addEventListener('submit',function(ev){
  ev.preventDefault();
  var form=ev.target, btn=document.getElementById('submitbtn');
  if(!form.checkValidity()){ show('err',t('fm.errreq')); form.reportValidity(); return; }
  var cv=document.getElementById('cv').files[0];
  var pf=document.getElementById('portafolio').files[0];
  if(cv && cv.size>CONFIG.maxCvMB*1048576){ show('err',t('fm.errsize')); return; }
  if(pf && pf.size>CONFIG.maxPfMB*1048576){ show('err',t('fm.errsize')); return; }

  btn.disabled=true; show('ok',t('fm.sending'));
  var fd=new FormData(form);
  var data={ enviado_en:new Date().toISOString(), idioma:LANG };
  fd.forEach(function(v,k){ if(k==='cv'||k==='portafolio') return;
    if(k==='perfil'){ data.perfiles=(data.perfiles||[]).concat([v]); } else { data[k]=v; } });
  data.perfiles=(data.perfiles||[]).join(' | ');

  Promise.all([cv?toBase64(cv):null,pf?toBase64(pf):null]).then(function(b){
    if(cv){ data.cv_nombre=cv.name; data.cv_tipo=cv.type; data.cv_base64=b[0]; }
    if(pf){ data.portafolio_nombre=pf.name; data.portafolio_tipo=pf.type; data.portafolio_base64=b[1]; }
    if(CONFIG.endpoint){
      /* text/plain evita el preflight CORS: necesario para Google Apps Script.
         n8n, Make, Zapier y cualquier backend propio reciben el mismo JSON igual. */
      return fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})
        .then(function(r){ if(!r.ok) throw new Error('http'); });
    }
    var all=JSON.parse(localStorage.getItem('ll_apps')||'[]');
    all.push(data); localStorage.setItem('ll_apps',JSON.stringify(all));
    return true;
  }).then(function(){
    document.getElementById('formview').style.display='none';
    document.getElementById('doneview').style.display='block';
    window.scrollTo(0,0);
  }).catch(function(){
    btn.disabled=false; show('err',t('fm.errsend'));
  });
});

/* modo administrador: postular.html?admin=1 descarga las postulaciones guardadas */
if(location.search.indexOf('admin=1')>-1){
  var raw=localStorage.getItem('ll_apps')||'[]';
  var blob=new Blob([raw],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='postulaciones-limly-labs.json';
  a.textContent='Descargar postulaciones guardadas ('+JSON.parse(raw).length+')';
  a.style.cssText='display:block;padding:16px 24px;color:#FF6B4A';
  document.body.insertBefore(a,document.body.firstChild);
}

try{saved=localStorage.getItem('ll_lang')||'';}catch(e){saved='';}
if(!saved){saved='es';}
applyLang(saved);
