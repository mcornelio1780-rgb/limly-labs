<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de postulaciones — Limly Labs</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1130; --navy2:#161B3D; --cream:#F4F1EA;
  --coral:#FF6B4A; --peach:#FFB088; --muted:#6B6F8C;
  --line:rgba(244,241,234,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--cream);
  font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--peach)}
.wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px}

header{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;
  justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line)}
h1{font-family:'Space Mono',monospace;font-size:20px;margin:0;letter-spacing:-.02em}
h1 span{color:var(--coral)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}

/* ── Puerta: sin clave, la página no muestra nada ───────────────────── */
.gate{max-width:520px;margin:64px auto;text-align:left}
.gate h2{font-family:'Space Mono',monospace;font-size:17px;margin:0 0 10px}
.gate p{color:var(--muted);font-size:14px;line-height:1.65;margin:0 0 22px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin:0 0 7px}
input[type=text],input[type=password],input[type=search]{
  width:100%;padding:12px 14px;border-radius:9px;border:1px solid var(--line);
  background:var(--navy2);color:var(--cream);font:inherit;font-size:14px}
input:focus{outline:none;border-color:var(--coral)}
.field{margin-bottom:16px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:9px;
  padding:12px 22px;background:var(--coral);color:#fff}
button:hover{background:#ff5733}
button.ghost{background:transparent;color:var(--cream);border:1px solid var(--line);
  padding:9px 16px;font-size:13px;font-weight:500}
button.ghost:hover{border-color:var(--coral);background:transparent}

/* ── Barra de acciones ──────────────────────────────────────────────── */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:24px 0 18px}
.bar input[type=search]{flex:1;min-width:220px}
.count{font-family:'Space Mono',monospace;font-size:13px;color:var(--muted);
  white-space:nowrap}
.count b{color:var(--cream)}

/* ── Lista de postulantes ───────────────────────────────────────────── */
.row{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;
  background:var(--navy2);overflow:hidden}
.row > summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;
  grid-template-columns:1fr auto;gap:6px 18px;align-items:center}
.row > summary::-webkit-details-marker{display:none}
.row:hover{border-color:rgba(255,107,74,.4)}
.who{font-weight:600;font-size:15px}
.who em{font-style:normal;color:var(--muted);font-weight:400}
.meta{grid-column:1;color:var(--muted);font-size:13px}
.when{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);
  text-align:right;grid-row:1/3}
.detail{padding:4px 18px 20px;border-top:1px solid var(--line)}
dl{display:grid;grid-template-columns:190px 1fr;gap:9px 20px;margin:16px 0 0;font-size:14px}
dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;
  padding-top:2px}
dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}

.msg{padding:14px 16px;border-radius:9px;font-size:14px;margin:18px 0;line-height:1.6}
.msg.err{background:rgba(255,107,74,.12);border:1px solid rgba(255,107,74,.45)}
.msg.info{background:var(--navy2);border:1px solid var(--line);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:70px 20px;font-size:15px}
.links{font-size:13px;color:var(--muted);margin-top:26px;
  padding-top:18px;border-top:1px solid var(--line)}
.links a{margin-right:20px}
[hidden]{display:none!important}
@media(max-width:640px){
  dl{grid-template-columns:1fr;gap:3px 0}
  dt{margin-top:10px}
  .when{grid-row:auto;grid-column:1;text-align:left}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>Postulaciones <span>·</span> Limly Labs 2026</h1>
    <p class="sub" id="sub">Panel interno</p>
    <p class="sub" id="fuente"></p>
  </div>
  <button class="ghost" id="salir" hidden>Cerrar sesión</button>
</header>

<!-- Puerta ─────────────────────────────────────────────────────────── -->
<section class="gate" id="gate">
  <h2>Clave del panel</h2>
  <p>Esta página no muestra nada hasta que introduzcas la clave: la que pusiste
     en <code>PANEL_PASSWORD</code>, en las variables de entorno de Vercel.</p>
  <form id="gateform">
    <div class="field">
      <label for="clave">Clave</label>
      <input type="password" id="clave" autocomplete="off" spellcheck="false" required>
    </div>
    <button type="submit">Entrar</button>
  </form>
  <div id="gatemsg"></div>
</section>

<!-- Panel ──────────────────────────────────────────────────────────── -->
<section id="panel" hidden>
  <div class="bar">
    <input type="search" id="q" placeholder="Buscar por nombre, correo, universidad, squad…">
    <span class="count" id="count"></span>
    <button class="ghost" id="recargar">Recargar</button>
    <button class="ghost" id="csv">Descargar CSV</button>
  </div>
  <div id="lista"></div>
  <div class="links" id="links"></div>
</section>

</div>
<script>
/* Fuente principal: el almacén propio en Vercel. Si no responde, se intenta
   Apps Script con la misma clave, para que una caída de Google no deje el
   panel a oscuras. */
var API = "/api";
var APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx2NAxteROHoYJ_l9HH_w3QmLiWLflwlX4riidzoyMee-ydf36agk3bIl1sbh5nx2tf4Q/exec";

/* Orden y etiqueta de cada campo. Vale para pintar, para el CSV y para
   traducir las columnas que llegan de Apps Script. */
var CAMPOS = [
  {k:'recibido_en',  l:'Fecha'},
  {k:'idioma',       l:'Idioma'},
  {k:'nombres',      l:'Nombres'},
  {k:'apellidos',    l:'Apellidos'},
  {k:'email',        l:'Correo'},
  {k:'telefono',     l:'Teléfono'},
  {k:'pais',         l:'País'},
  {k:'ciudad',       l:'Ciudad'},
  {k:'universidad',  l:'Universidad'},
  {k:'carrera',      l:'Carrera'},
  {k:'ciclo',        l:'Ciclo'},
  {k:'horas',        l:'Horas/semana'},
  {k:'squad',        l:'Squad'},
  {k:'perfiles',     l:'Perfiles'},
  {k:'camara',       l:'Frente a cámara'},
  {k:'enlace',       l:'Enlace portafolio'},
  {k:'motivacion',   l:'Motivación'},
  {k:'fuente',       l:'Cómo se enteró'},
  {k:'consent',      l:'Consentimiento'}
];

var $ = function(id){ return document.getElementById(id); };
var estado = { lista:[], fuente:'', hoja:'', carpeta:'' };
var CLAVE = '';

function guardado(k,d){ try{ return localStorage.getItem(k)||d; }catch(e){ return d; } }
function guardar(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function txt(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function esUrl(v){ return /^https?:\/\//i.test(String(v)); }

/* ── Carga ──────────────────────────────────────────────────────────── */

function desdeApi(clave){
  return fetch(API+'/postulaciones?t='+Date.now(),{headers:{'Authorization':'Bearer '+clave}})
    .then(function(r){
      return r.json().catch(function(){ throw new Error('el almacén respondió '+r.status); });
    })
    .then(function(d){
      if(!d.ok) throw new Error(d.error||'el almacén devolvió un error');
      return { lista:d.postulaciones||[], fuente:'almacén de Vercel', hoja:'', carpeta:'' };
    });
}

/* Apps Script devuelve filas paralelas a una cabecera; las pasamos a objetos
   con las mismas claves que usa el almacén, para pintar todo por un solo sitio. */
function desdeAppsScript(clave){
  var url = APPS_SCRIPT+'?panel='+encodeURIComponent(clave)+'&datos=1&t='+Date.now();
  return fetch(url).then(function(r){ return r.json(); }).then(function(d){
    if(!d.ok) throw new Error(d.error||'Apps Script devolvió un error');
    if(!d.filas) throw new Error('clave incorrecta para Apps Script');
    var porEtiqueta = {};
    CAMPOS.forEach(function(c){ porEtiqueta[c.l]=c.k; });
    var lista = d.filas.map(function(f){
      var o = {};
      (d.columnas||[]).forEach(function(col,i){
        var k = porEtiqueta[col];
        if(k) o[k]=f[i];
        else if(col==='CV' && f[i]) o.cv={url:f[i],nombre:'CV'};
        else if(col==='Portafolio' && f[i]) o.portafolio={url:f[i],nombre:'Portafolio'};
      });
      return o;
    });
    return { lista:lista, fuente:'Google Sheet (plan B)', hoja:d.hoja||'', carpeta:d.carpeta||'' };
  });
}

function cargar(clave){
  return desdeApi(clave).catch(function(err){
    console.warn('El almacén no respondió:',err.message);
    return desdeAppsScript(clave).catch(function(err2){
      throw new Error(err.message+' · Plan B: '+err2.message);
    });
  });
}

/* ── Render ─────────────────────────────────────────────────────────── */

function pintar(){
  var q = $('q').value.trim().toLowerCase();
  var lista = estado.lista.filter(function(p){
    if(!q) return true;
    return CAMPOS.map(function(c){ return p[c.k]||''; }).join(' ').toLowerCase().indexOf(q)>-1;
  });

  $('count').innerHTML = q
    ? '<b>'+lista.length+'</b> de '+estado.lista.length
    : '<b>'+estado.lista.length+'</b> postulación'+(estado.lista.length===1?'':'es');

  if(!lista.length){
    $('lista').innerHTML = '<p class="empty">'+
      (estado.lista.length ? 'Ninguna coincide con la búsqueda.'
                           : 'Todavía no hay postulaciones.')+'</p>';
    return;
  }

  $('lista').innerHTML = lista.map(function(p,i){
    var nombre = ((p.nombres||'')+' '+(p.apellidos||'')).trim() || 'Sin nombre';
    var meta = [p.universidad,p.carrera,p.squad].filter(Boolean).join(' · ');
    var fecha = (p.recibido_en||'').replace('T',' ').slice(0,16);

    var detalle = CAMPOS.map(function(c){
      var v = p[c.k];
      if(v===undefined||v===null||v==='') return '';
      return '<dt>'+txt(c.l)+'</dt><dd>'+(esUrl(v)
        ? '<a href="'+txt(v)+'" target="_blank" rel="noopener">'+txt(v)+'</a>'
        : txt(v))+'</dd>';
    }).join('');

    detalle += adjunto('CV', p.cv, i, 'cv');
    detalle += adjunto('Portafolio', p.portafolio, i, 'pf');

    return '<details class="row"><summary>'+
      '<span class="who">'+txt(nombre)+' <em>'+txt(p.email||'')+'</em></span>'+
      '<span class="when">'+txt(fecha)+'</span>'+
      '<span class="meta">'+txt(meta)+'</span>'+
      '</summary><div class="detail"><dl>'+detalle+'</dl></div></details>';
  }).join('');

  /* Los adjuntos del almacén son privados: se piden con la clave, no con un
     enlace suelto, así que hay que engancharlos después de pintar. */
  Array.prototype.forEach.call($('lista').querySelectorAll('[data-ruta]'),function(b){
    b.addEventListener('click',function(){ bajarArchivo(b.dataset.ruta,b.dataset.nombre,b); });
  });
}

function adjunto(etiqueta,a,i,slug){
  if(!a) return '';
  if(a.url) return '<dt>'+etiqueta+'</dt><dd><a href="'+txt(a.url)+'" target="_blank" rel="noopener">'+txt(a.nombre||etiqueta)+'</a></dd>';
  if(a.ruta) return '<dt>'+etiqueta+'</dt><dd><button class="ghost" type="button" '+
    'data-ruta="'+txt(a.ruta)+'" data-nombre="'+txt(a.nombre||etiqueta)+'">Descargar '+txt(a.nombre||etiqueta)+'</button></dd>';
  return '';
}

function bajarArchivo(ruta,nombre,boton){
  var antes = boton.textContent;
  boton.disabled = true; boton.textContent = 'Bajando…';
  fetch(API+'/archivo?ruta='+encodeURIComponent(ruta),{headers:{'Authorization':'Bearer '+CLAVE}})
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.blob(); })
    .then(function(b){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = nombre || 'archivo';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 30000);
    })
    .catch(function(err){ alert('No se pudo bajar el archivo: '+err.message); })
    .then(function(){ boton.disabled=false; boton.textContent=antes; });
}

function pintarEnlaces(){
  var l = [];
  if(estado.hoja)    l.push('<a href="'+txt(estado.hoja)+'" target="_blank" rel="noopener">Abrir la Google Sheet</a>');
  if(estado.carpeta) l.push('<a href="'+txt(estado.carpeta)+'" target="_blank" rel="noopener">Abrir la carpeta de CVs</a>');
  $('links').innerHTML = l.join('');
  $('fuente').textContent = estado.fuente ? 'Leyendo de: '+estado.fuente : '';
}

/* ── CSV ────────────────────────────────────────────────────────────── */

function csv(){
  var esc = function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; };
  var cabecera = CAMPOS.map(function(c){ return c.l; }).concat(['CV','Portafolio']);
  var filas = estado.lista.map(function(p){
    return CAMPOS.map(function(c){ return p[c.k]; })
      .concat([ p.cv&&(p.cv.url||p.cv.ruta)||'', p.portafolio&&(p.portafolio.url||p.portafolio.ruta)||'' ]);
  });
  var cuerpo = [cabecera].concat(filas).map(function(f){ return f.map(esc).join(','); }).join('\r\n');
  /* El BOM hace que Excel abra bien las tildes y la ñ. */
  var blob = new Blob(["\ufeff"+cuerpo], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'postulaciones-limly-labs-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ── Arranque ───────────────────────────────────────────────────────── */

function abrir(clave){
  $('gatemsg').innerHTML = '<div class="msg info">Cargando…</div>';
  return cargar(clave).then(function(r){
    CLAVE = clave; guardar('ll_panel_key', clave);
    estado = r;
    $('gate').hidden = true; $('panel').hidden = false; $('salir').hidden = false;
    $('gatemsg').innerHTML = '';
    $('sub').textContent = 'Panel interno · datos en vivo';
    pintar(); pintarEnlaces();
  }).catch(function(err){
    $('gatemsg').innerHTML = '<div class="msg err">'+txt(err.message)+'</div>';
    throw err;
  });
}

$('gateform').addEventListener('submit', function(ev){
  ev.preventDefault();
  abrir($('clave').value.trim()).catch(function(){});
});

$('q').addEventListener('input', pintar);
$('csv').addEventListener('click', csv);
$('recargar').addEventListener('click', function(){
  var b = $('recargar'); b.disabled = true; b.textContent = 'Cargando…';
  cargar(CLAVE).then(function(r){ estado = r; pintar(); pintarEnlaces(); })
    .catch(function(err){
      $('lista').insertAdjacentHTML('beforebegin','<div class="msg err">'+txt(err.message)+'</div>');
    })
    .then(function(){ b.disabled = false; b.textContent = 'Recargar'; });
});
$('salir').addEventListener('click', function(){
  guardar('ll_panel_key',''); location.reload();
});

/* Si ya entraste antes en este navegador, no vuelve a pedir la clave. */
var recordada = guardado('ll_panel_key','');
if(recordada) abrir(recordada).catch(function(){});
</script>
</body>
</html>
